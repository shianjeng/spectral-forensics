[project]
name = "spectral-forensics"
version = "0.4.0"
description = "Spectral inspection toolkit: reassigned spectrograms, lossy-transcode forensics, and invertible frequency-domain editing."
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Hank Zhu" }]
keywords = [
    "audio", "dsp", "spectrogram", "signal-processing",
    "audio-forensics", "transcode-detection", "flac", "mp3",
    "reassigned-spectrogram", "griffin-lim", "librosa",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "pillow>=10.0",
    "librosa>=0.10",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "mypy>=1.10",
    "pytest>=7.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/shianjeng/spectral-forensics"
Repository = "https://github.com/shianjeng/spectral-forensics"

[project.scripts]
spf = "spectral_forensics.cli:main"
spectral-forensics = "spectral_forensics.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF022", "BLE", "PLW1510", "S110", "C408"]
ignore = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "soundfile"
ignore_missing_imports = true
