[project]
name = "sonogram"
version = "0.3.0"
description = "Render a song into a spectral poster or spectrum video."
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
    "librosa>=0.10",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "soundfile>=0.12",
]

[project.scripts]
sonogram = "sonogram.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
