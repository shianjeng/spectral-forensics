[project]
name = "sonogram"
version = "0.3.0"
description = "Spectral inspection toolkit: reassigned spectrograms, lossy-transcode forensics, and invertible frequency-domain editing."
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "librosa>=0.10",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "soundfile>=0.12",
]

[project.urls]
Homepage = "https://github.com/shianjeng/spectral-forensics"
Repository = "https://github.com/shianjeng/spectral-forensics"

[project.scripts]
sonogram = "sonogram.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
