name: tests

on:
  push:
    branches: [main]
  pull_request:
  # 依赖未锁版本，每周一跑一次，好在用户之前先发现上游漂移。
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-type-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev tools
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy spectral_forensics tests

      - name: Build package
        run: python -m build

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 在线 Demo（docs/）是纯静态页面，没有构建步骤：至少保证每个脚本都能被解析
      - name: Check the web demo's scripts
        run: for f in docs/*.js; do node --check "$f"; done

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # 浏览器版与 Python 版的一致性测试要在 node 里跑 docs/analysis.js
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        env:
          # 缺 node 时一致性测试直接失败，而不是悄悄跳过
          SPF_REQUIRE_NODE: "1"
        run: pytest -q
